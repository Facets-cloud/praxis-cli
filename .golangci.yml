# golangci-lint v2. `make lint` runs it locally; CI runs the same config with
# the version pinned in .github/workflows/ci.yml. The gate is ZERO findings —
# a linter with a tolerated backlog is one nobody reads.
#
# A finding that is wrong for a specific line gets a `//nolint:<linter> // why`
# on that line. nolintlint fails the build if the reason is missing, or if the
# directive no longer suppresses anything.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose   # an HTTP body left open leaks a connection per request
    - copyloopvar # a Go 1.22+ loop variable no longer needs a copy
    - errorlint   # == and type assertions on errors miss wrapped errors
    - gocritic    # exitAfterDefer caught a real defer that never ran
    - misspell
    - nilerr      # an error observed and then dropped must say why
    - nolintlint
    - unconvert
    - usestdlibvars
    - wastedassign
  # intrange and perfsprint are NOT enabled: style churn with no defect behind it.
  #
  # gosec is deliberately NOT enabled: the CLI stores tokens in 0600 files and
  # shells out to external commands.
  settings:
    errcheck:
      # Best-effort calls whose failure has no useful handler: writing a line
      # to the terminal, closing a body or file, or unsetting a test environment variable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - os.Remove
        - os.Unsetenv
    gocritic:
      disabled-checks:
        - ifElseChain # a chain of three is often clearer than a switch
  exclusions:
    rules:
      # Test helpers write fixtures and probe their own servers; the
      # production rules above are meant for production code.
      - path: _test\.go
        linters: [bodyclose]

formatters:
  enable:
    - gofmt

issues:
  # Show everything. The defaults hide the fourth identical message and
  # everything past fifty per linter, so a clean-looking run can still be
  # hiding work.
  max-issues-per-linter: 0
  max-same-issues: 0
